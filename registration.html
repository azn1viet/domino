// Helper function to convert Firebase errors to friendly messages
function getFriendlyErrorMessage(firebaseError) {
  const errorCode = firebaseError.code || "";
  const errorMap = {
    "auth/email-already-in-use": "This email is already registered.<br>Please login instead.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Password is too weak.<br>Please use at least 6 characters.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect password. Please try again.",
    "auth/too-many-requests": "Too many failed attempts.<br>Please try again later.",
    "auth/network-request-failed": "Network error. Please check your connection.",
    "auth/invalid-credential": "Invalid email or password.<br>Please try again.",
    "auth/user-disabled": "This account has been disabled.",
    "auth/operation-not-allowed": "Operation not allowed.<br>Please contact support."
  };

  return errorMap[errorCode] || firebaseError.message || "An error occurred. Please try again.";
}

// --- Send message (modeled for the 3 types) ---
async function sendMessage(senderUid, senderName, mode, target, messageText, gameName = null, tableId = null) {
  // This is an old send function, the new one is 'sendDirectMessage'
  // Keeping it to avoid breaking other logic
  const now = Date.now();

  const msg = {
    fromUid: senderUid,
    fromName: senderName,
    text: messageText,
    toType: mode, 
    toId: target,
    gameName,
    tableId,
    createdAt: now,
    delivered: false,
    read: false,
    deliveryTime: null,
    readTime: null
  };

  let refPath;

  if (mode === "user") {
    refPath = `messages/direct/${target}`;
  } else if (mode === "broadcast") {
    refPath = `messages/broadcast`;
  } else if (mode === "table") {
    refPath = `messages/tables/${gameName}/${tableId}`;
  } else {
    console.error("❌ Unknown message mode:", mode);
    return;
  }

  const msgRef = push(ref(db, refPath));
  await set(msgRef, msg);

  console.log(`✅ Message sent (${mode}):`, msg);
}

function listenBroadcastMessages() {

  onChildAdded(refBroadcast, (snap) => {

    showPopupMessage({

// This function is also not called.
function attachMessageListeners(myUid, onMessageCallback, activeTables = []) {
  const directRef = dbRef(db, `messages/direct/${myUid}`);
  onChildAdded(directRef, (snap) => {
    const m = snap.val();
    onMessageCallback({ path: `direct/${myUid}`, msg: m, key: snap.key });
  });

  const broadcastRef = dbRef(db, `messages/broadcast`);
  onChildAdded(broadcastRef, (snap) => {
    const m = snap.val();
    onMessageCallback({ path: `broadcast`, msg: m, key: snap.key });
  });

  activeTables.forEach(({ gameName, tableId }) => {
    const tableRef = dbRef(db, `messages/table/${gameName}/${tableId}`);
    onChildAdded(tableRef, (snap) => {
      const m = snap.val();
      onMessageCallback({ path: `table/${gameName}/${tableId}`, msg: m, key: snap.key });
    });
  });
}
///
// 🧲 Make the chat window draggable by its header (MOBILE + DESKTOP)
function makeChatDraggable(win) {
  const header = win.querySelector(".chatHeader");
  if (!header) return;
  
  let offsetX = 0, offsetY = 0, dragging = false;

  // 🖱️ MOUSE EVENTS (Desktop)
  header.addEventListener("mousedown", (e) => {
    e.preventDefault();
    dragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    win.style.left = e.clientX - offsetX + "px";
    win.style.top  = e.clientY - offsetY + "px";
    win.style.right = "auto";
    win.style.bottom = "auto";
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    document.body.style.userSelect = "auto";
  });

  // 📱 TOUCH EVENTS (Mobile)
  header.addEventListener("touchstart", (e) => {
    e.preventDefault();
    dragging = true;
    const touch = e.touches[0];
    offsetX = touch.clientX - win.offsetLeft;
    offsetY = touch.clientY - win.offsetTop;
    document.body.style.userSelect = "none";
  }, { passive: false });

  document.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    win.style.left = touch.clientX - offsetX + "px";
    win.style.top  = touch.clientY - offsetY + "px";
    win.style.right = "auto";
    win.style.bottom = "auto";
  }, { passive: false });

  document.addEventListener("touchend", () => {
    dragging = false;
    document.body.style.userSelect = "auto";
  });
}

///
// Format timestamp as "3m ago (2025/11/04 - 22:15)"
function formatTimestamp(ts) {
  if (!ts) return '';
  
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth() + 1).padStart(2, '0');
  const D = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  
  const diffSec = Math.floor((Date.now() - ts) / 1000);
  
  if (diffSec < 60) {
    return `now (${Y}/${M}/${D} - ${hh}:${mm})`;
  }
  
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) {
    return `${diffMin}m ago (${Y}/${M}/${D} - ${hh}:${mm})`;
  }
  
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) {
    return `${diffHr}h ago (${Y}/${M}/${D} - ${hh}:${mm})`;
  }
  
  const diffDay = Math.floor(diffHr / 24);
  return `${diffDay}d ago (${Y}/${M}/${D} - ${hh}:${mm})`;
}

function waitForChatCloseOrTimeout(senderUid, timeoutMs=6000) {
  return new Promise((resolve) => {
    const chatRow = document.querySelector(`#chat-${senderUid}`)?.closest('tr.chatRow');
    if (!chatRow) return setTimeout(resolve, timeoutMs);
    let resolved = false;
    const onClose = () => {
      if (resolved) return;
      resolved = true;
      chatRow.removeEventListener('chat:close', onCloseCustom);
      resolve();
    };
    function onCloseCustom(){ onClose(); }
    chatRow.addEventListener('chat:close', onCloseCustom);
    setTimeout(() => { if (!resolved) { resolved = true; chatRow.removeEventListener('chat:close', onCloseCustom); resolve(); } }, timeoutMs);
  });
}

  msgContainer.innerHTML = '';

  const arr = Object.entries(msgs || {}).map(([k,v]) => ({ id:k, ...v }));
  arr.sort((a,b)=> (a.sentAt||0) - (b.sentAt||0));
  arr.forEach(m => renderMessageBubble(msgContainer, m, m.senderUid === myUid));

  showChatRowFor(senderUid);

  for (const m of arr) {
    if (m.senderUid !== myUid && m.deliveredRead !== true) {
      const updRef = ref(db, `messages/direct/${myUid}/${senderUid}/${m.id}`);
      await update(updRef, { deliveredRead: true, deliveredTime: Date.now() });
    }
  }
  attachDirectChatSendHandler(senderUid);
}

function attachDirectChatSendHandler(receiverUid) {
  const btn = document.querySelector(`button.sendBtn[data-uid="${receiverUid}"]`);
  const input = document.querySelector(`#msgInput-${receiverUid}`);
  if (!btn || btn._attached) return;
  btn._attached = true;
  btn.addEventListener('click', async (e) => {
    const txt = input.value && input.value.trim();
    if (!txt) return;
    const me = auth.currentUser; if(!me) return showCustomPopup('Not logged in!', "error");
    await sendDirectMessage(me.uid, receiverUid, txt);
    input.value = '';
    const msgContainer = document.querySelector(`#chat-${receiverUid}`);
    renderMessageBubble(msgContainer, { text: txt, senderUid: me.uid, sentAt: Date.now() }, true);
  });
}

function showChatRowFor(uid) {
  const chatDiv = document.getElementById(`chat-${uid}`);
  if (!chatDiv) return;
  const chatRow = chatDiv.closest('tr.chatRow');
  if (chatRow) {
    chatRow.style.display = '';
  } else {
    chatDiv.closest('.chatRowFloating')?.classList.add('visible');
  }
}

function listenForIncomingDirectMessages(myUid) {
  if (messageListenerAttached) {
    console.log("⚠️ Message listener already attached, skipping...");
    return;
  }
  messageListenerAttached = myUid;
  console.log("✅ Attaching message listener for:", myUid);
  
  const inboxRef = ref(db, `messages/direct/${myUid}`);
  
  // Use onValue instead of nested onChildAdded
  const unsub = onValue(inboxRef, async (snapshot) => {
    if (!snapshot.exists()) return;
    
    const allSenders = snapshot.val();
    
    for (const senderUid in allSenders) {
      const messages = allSenders[senderUid];
      
      for (const msgId in messages) {
        const msg = messages[msgId];
        
        // Skip if already delivered/read
        if (msg.deliveredRead === true) continue;
        
        // Get sender's name
        const senderUserSnap = await get(ref(db, `users/${senderUid}`));
        const senderName = senderUserSnap.exists() ? senderUserSnap.val().userName : "Unknown User";
        
        const currentUser = JSON.parse(localStorage.getItem("loggedUser"));
        if (!currentUser) return;
        
        // Open or create chat window
        if (!openChatWindows[senderUid]) {
          showChatWindow(senderUid, senderName, currentUser);
        }
        
        // Check if message is old (offline message)
        const messageAge = Date.now() - msg.sentAt;
        const isOfflineMessage = messageAge > 10000;
        
        // Append bubble
        appendChatBubble(senderUid, "left", msg.text, isOfflineMessage ? msg.sentAt : null);
        
        // Mark as delivered and read
        const msgRef = ref(db, `messages/direct/${myUid}/${senderUid}/${msgId}`);
        await update(msgRef, {
          deliveredRead: true,
          deliveredTime: Date.now()
        });
        
        // Delete after 2 seconds
        setTimeout(async () => {
          try {
            await set(msgRef, null);
            console.log("🗑️ Deleted read message:", msgId);
          } catch (err) {
            console.error("❌ Failed to delete message:", err);
          }
        }, 2000);
      }
    }
  });
  
  globalMessageUnsubscribers.push(unsub);
}

// ---------- Public / Table listeners (simple streaming) ----------
function listenTableMessages(gameName, tableName, onMsgCallback) {
  // This function is not called
  const base = ref(db, `messages/table/${gameName}/${tableName}`);
  onChildAdded(base, (snap) => {
    const m = snap.val();
    onMsgCallback && onMsgCallback(m);
  });
}

function listenPublicMessages(onMsgCallback) {
  // This function is not called
  const base = ref(db, `messages/public`);
  onChildAdded(base, (snap) => {
    const m = snap.val();
    onMsgCallback && onMsgCallback(m);
  });
}

// ---------- Helper: mark message delivered manually (not used directly) ----------
async function markMessageDeliveredFor(receiverUid, senderUid, msgId) {
  await update(ref(db, `messages/direct/${receiverUid}/${senderUid}/${msgId}`), {
    deliveredRead: true,
    deliveredTime: Date.now()
  });
}
