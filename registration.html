  const inboxRef = ref(db, `messages/direct/${uid}`);
  const snap = await get(inboxRef);
  if (!snap.exists()) return;
  const msgs = Object.entries(snap.val());

      });

async function watchUsers() {
  const db = getDatabase();
  const usersRef = ref(db, "users");
  const authRef = ref(db, "auth");
  const table = document.getElementById("userTable");
  const tbody = table.querySelector("tbody");

  onValue(usersRef, async (snapshot) => {
    const users = snapshot.val() || {};
    const authSnap = await get(authRef);
    const authData = authSnap.exists() ? authSnap.val() : {};

    const now = Date.now();
    tbody.innerHTML = "";

    Object.keys(users).forEach((uid) => {
      const u = users[uid];
      const a = authData[uid] || {};
      const lastLoginAt = a.currentLoginAt || 0;
      const diffMin = Math.floor((now - lastLoginAt) / 60000);
      const online = diffMin < 5;

      // --- main user row ---
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="color:lime; font-weight:bold;">${u.userName}</td>
        <td>${u.userRole === "1" ? "👑 Admin" : "👤 User"}</td>
        <td>
          ${
            online
              ? `<span style="color:lime;">●</span> Online ${diffMin === 0 ? "now" : diffMin + "m ago"}`
              : `<span style="color:gray;">●</span> Offline`
          }
        </td>
        <td>
          <button class="msgBtn" data-uid="${uid}" title="Send Message">💬</button>
        </td>
      `;

      // --- hidden chat row ---
      const chatRow = document.createElement("tr");
      chatRow.classList.add("chatRow");
      chatRow.style.display = "none";
      chatRow.innerHTML = `
        <td colspan="4">
          <div class="chatBox">
            <div class="chatMessages" id="chat-${uid}"></div>
            <div class="chatInput">
              <input type="text" placeholder="Type a message..." id="msgInput-${uid}" />
              <button class="sendBtn" data-uid="${uid}">Send</button>
            </div>
          </div>
        </td>
      `;

      tbody.appendChild(tr);
      tbody.appendChild(chatRow);
    });

    table.style.display = "table";

    // ✅ Attach handlers every time the table updates
    attachMessageHandlers();
  });

  
}


///

// --- Utility: build message object ---
function buildMessageObject({ fromUid, fromName, toType, toId, text, gameName = null, tableId = null }) {
  return {
    fromUid,
    fromName,
    toType,          // "user" | "broadcast" | "table"
    toId,
    gameName,
    tableId,
    text,
    createdAt: Date.now()
  };
}

// --- Send message (modeled for the 3 types) ---
async function sendMessage(senderUid, senderName, mode, target, messageText, gameName = null, tableId = null) {
  const now = Date.now();

  // ✅ Create base message object
  const msg = {
    fromUid: senderUid,
    fromName: senderName,
    text: messageText,
    toType: mode, // 'user' | 'broadcast' | 'table'
    toId: target,
    gameName,
    tableId,
    createdAt: now,
    delivered: false,
    read: false,
    deliveryTime: null,
    readTime: null
  };

  let refPath;

  // ✅ Mode Routing
  if (mode === "user") {
    // direct message to single receiver
    refPath = `messages/direct/${target}`;
  } else if (mode === "broadcast") {
    // global chat visible to all online
    refPath = `messages/broadcast`;
  } else if (mode === "table") {
    // message inside game table
    refPath = `messages/tables/${gameName}/${tableId}`;
  } else {
    console.error("❌ Unknown message mode:", mode);
    return;
  }

  const msgRef = push(ref(db, refPath));
  await set(msgRef, msg);

  console.log(`✅ Message sent (${mode}):`, msg);
}
///
//import { ref, onChildAdded, update } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

function listenDirectMessages(uid) {
  const inboxRef = ref(db, `messages/direct/${uid}`);

  onChildAdded(inboxRef, async (snap) => {
    const msg = snap.val();
    if (!msg) return;

    console.log("📩 New message received:", msg);

    // Show popup only for new, unread messages
    if (!msg.read) {
      showPopupMessage(msg);

      // Mark as delivered + read
      await update(snap.ref, {
        delivered: true,
        deliveryTime: Date.now(),
        read: true,
        readTime: Date.now()
      });
    }
  });
}


function listenBroadcastMessages() {
  const refBroadcast = ref(db, "messages/broadcast");
  onChildAdded(refBroadcast, (snap) => {
    const msg = snap.val();
    if (!msg) return;
    showPopupMessage({
      ...msg,
      fromName: `${msg.fromName} (Broadcast)`
    });
  });
}

function listenTableMessages(gameName, tableId) {
  const refTable = ref(db, `messages/tables/${gameName}/${tableId}`);
  window.tableListener = onChildAdded(refTable, (snap) => {
    const msg = snap.val();
    appendToTableChatUI(msg); // render chat bubble under table area
  });
}


///

// --- Listening: attach listeners for a given current user & their active tables ---
// This subscribes to direct messages to `myUid`, broadcast, and any table paths in `activeTables`
function attachMessageListeners(myUid, onMessageCallback, activeTables = []) {
  // direct messages to me
  const directRef = dbRef(db, `messages/direct/${myUid}`);
  onChildAdded(directRef, (snap) => {
    const m = snap.val();
    onMessageCallback({ path: `direct/${myUid}`, msg: m, key: snap.key });
  });

  // broadcast messages
  const broadcastRef = dbRef(db, `messages/broadcast`);
  onChildAdded(broadcastRef, (snap) => {
    const m = snap.val();
    onMessageCallback({ path: `broadcast`, msg: m, key: snap.key });
  });

  // table messages (subscribe to each active table)
  activeTables.forEach(({ gameName, tableId }) => {
    const tableRef = dbRef(db, `messages/table/${gameName}/${tableId}`);
    onChildAdded(tableRef, (snap) => {
      const m = snap.val();
      onMessageCallback({ path: `table/${gameName}/${tableId}`, msg: m, key: snap.key });
    });
  });
}
///
// 🧲 Make the chat window draggable by its header
function makeChatDraggable(win) {
  const header = win.querySelector(".chatHeader");
  if (!header) return;
  let offsetX = 0, offsetY = 0, dragging = false;

  header.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    win.style.left = e.clientX - offsetX + "px";
    win.style.top  = e.clientY - offsetY + "px";
    win.style.right = "auto";
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    document.body.style.userSelect = "auto";
  });
}

    win.style.top = `${i * 35}px`;
    win.style.left = "0px";
    i++;
  }
}

function listenForIncomingMessages(uid) {
 // 🧠 Avoid double attaching listener for same user
  if (activeListenerUid === uid) {
    console.log("⚠️ Listener already active for", uid);

  activeListenerUid = uid;

// Open or reuse top-right floating chat window
if (!openChatWindows[msg.fromUid]) {

}
appendChatMessageTo(msg.fromUid, "left", msg.text);

    // Mark delivered + read

}

function registerOnlineStatus(uid) {
  const userStatusRef = ref(db, `users/${uid}/isOnline`);
  const connectedRef = ref(db, ".info/connected");

  const IDLE_TIMEOUT = 30 * 60 * 1000; // 15 minutes
  let idleTimer;

  function setOnline() {
    set(userStatusRef, true);
    resetIdleTimer();
  }

  function setOffline() {
    set(userStatusRef, false);
  }

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(setOffline, IDLE_TIMEOUT);
  }

  // mark offline when connection lost
  onValue(connectedRef, (snap) => {
    if (snap.val() === false) return;
    onDisconnect(userStatusRef).set(false);
    setOnline();
  });

  // user activity resets idle timer
  ["mousemove", "keydown", "click"].forEach(evt => {
    window.addEventListener(evt, resetIdleTimer);
  });
}

  }

  Object.assign(chatWin.style, {

    left: "0px",
    top: `${offset}px`,
    width: "340px",

    flexDirection: "column",
    zIndex: 9999 + Object.keys(openChatWindows).length,
    fontFamily: '"Inter", system-ui, sans-serif'
  });

  chatWin.innerHTML = `

      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;

      <button class="chatClose" style="
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        font-size: 1.1rem;
        opacity: 0.7;
        transition: 0.2s;
      ">✖</button>
    </div>
    <div class="chatMessages" id="chatMessages-${senderUid}" style="
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.4) transparent;

    <div class="chatInputArea" style="
      display: flex;
      background: rgba(255,255,255,0.06);
      border-top: 1px solid rgba(255,255,255,0.06);
      align-items: center;
      padding: 8px;
      border-radius: 0 0 18px 18px;

      <input type="text" id="msgInput-${senderUid}" placeholder="Type a message..." style="

        border-radius: 12px;
        border: none;
        color: white;
        padding: 8px 10px;
        outline: none;
        font-size: 0.88rem;
      ">
      <button class="sendBtn" data-uid="${senderUid}" style="
        margin-left: 8px;
        background: #4a86ff;
        color: #fff;
        border: none;
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 12px;
        font-weight: 600;
        transition: 0.2s;
      ">Send</button>
    </div>
  `;

  container.appendChild(chatWin);
  openChatWindows[senderUid] = chatWin;

  // close button with hover effect
  const closeBtn = chatWin.querySelector(".chatClose");
  closeBtn.addEventListener("mouseenter", () => closeBtn.style.opacity = "1");
  closeBtn.addEventListener("mouseleave", () => closeBtn.style.opacity = "0.7");
  closeBtn.addEventListener("click", () => {
    chatWin.remove();
    delete openChatWindows[senderUid];
    repositionChatWindows();
  });

  // send button hover effect
  const sendBtn = chatWin.querySelector(".sendBtn");
  sendBtn.addEventListener("mouseenter", () => sendBtn.style.opacity = "0.85");
  sendBtn.addEventListener("mouseleave", () => sendBtn.style.opacity = "1");

  // send + enter key
  const msgInput = chatWin.querySelector(`#msgInput-${senderUid}`);
  sendBtn.addEventListener("click", () => sendChatMessage(senderUid, senderName, currentUser, msgInput));
  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChatMessage(senderUid, senderName, currentUser, msgInput);
  });

  makeChatDraggable(chatWin);

  return chatWin;
}
